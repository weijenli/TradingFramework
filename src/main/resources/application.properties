# Bundled defaults. Override in config/application.properties or with environment variables
# (key upper-cased, dots -> underscores, e.g. FINNHUB_APIKEY).

# ---- universe ----
symbols=AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM,XOM,KO,WMT,UNH

# ---- end-of-day data ----
data.dir=downloaded
# Tried in order; a source needing an API key is skipped when the key is empty.
# (stooq is keyless but currently answers non-browser clients with a JavaScript challenge page.)
data.sources=eodhd,twelvedata,tiingo,alphavantage,stooq
data.historyStart=2015-01-01
data.archiveRaw=true
# Free keys: eodhd.com, twelvedata.com, tiingo.com, alphavantage.co
eodhd.apiKey=
twelvedata.apiKey=
tiingo.apiKey=
alphavantage.apiKey=
