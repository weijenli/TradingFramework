# ---- database (any JDBC URL; upsert SQL is H2's MERGE ... KEY) ----
db.enabled=true
db.url=jdbc:h2:./data/db/trading;AUTO_SERVER=TRUE
db.user=sa
db.password=

# ---- backtest ----
backtest.initialCapital=100000
backtest.positionSizePct=0.10
backtest.commission=1.0
backtest.slippagePct=0.0005
backtest.from=2018-01-01
backtest.reportDir=reports

# ---- daily scan ----
daily.runTime=16:30
daily.zone=America/New_York
daily.reportDir=reports
# NYSE full-day closures - verify against the official calendar each year.
daily.holidays=2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25,\
  2027-01-01,2027-01-18,2027-02-15,2027-03-26,2027-05-31,2027-06-18,2027-07-05,2027-09-06,2027-11-25,2027-12-24

# ---- real-time alerts ----
# finnhub (needs finnhub.apiKey) or simulated
realtime.feed=finnhub
finnhub.apiKey=
realtime.symbols=AAPL,MSFT,NVDA
# SYMBOL>LEVEL or SYMBOL<LEVEL
realtime.priceAlerts=
realtime.movePct=0.03
realtime.volumeSpike=2.0
realtime.cooldownSeconds=900
realtime.signalLog=reports/signals.csv
# Optional Slack-compatible incoming webhook URL
realtime.webhookUrl=
